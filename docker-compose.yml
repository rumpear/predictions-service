services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: predictions
      POSTGRES_PASSWORD: predictions
      POSTGRES_DB: predictions
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U predictions']
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    image: redis:7
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 15

  app:
    build:
      context: .
    environment:
      PORT: 3000
      DATABASE_URL: postgres://predictions:predictions@postgres:5432/predictions
      REDIS_URL: redis://redis:6379
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "node dist/infra/db/migrate.js up && node dist/main.js"
